<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <rect width="192" height="192" rx="40" fill="#0B0F17"/>
  <rect width="192" height="192" rx="40" fill="url(#grad)"/>
  <!-- CPU chip body -->
  <rect x="56" y="56" width="80" height="80" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
  <!-- Chip pins left -->
  <rect x="38" y="72" width="14" height="6" rx="2" fill="#38BDF8"/>
  <rect x="38" y="86" width="14" height="6" rx="2" fill="#38BDF8"/>
  <rect x="38" y="100" width="14" height="6" rx="2" fill="#38BDF8"/>
  <rect x="38" y="114" width="14" height="6" rx="2" fill="#38BDF8"/>
  <!-- Chip pins right -->
  <rect x="140" y="72" width="14" height="6" rx="2" fill="#38BDF8"/>
  <rect x="140" y="86" width="14" height="6" rx="2" fill="#38BDF8"/>
  <rect x="140" y="100" width="14" height="6" rx="2" fill="#38BDF8"/>
  <rect x="140" y="114" width="14" height="6" rx="2" fill="#38BDF8"/>
  <!-- Chip pins top -->
  <rect x="72" y="38" width="6" height="14" rx="2" fill="#38BDF8"/>
  <rect x="86" y="38" width="6" height="14" rx="2" fill="#38BDF8"/>
  <rect x="100" y="38" width="6" height="14" rx="2" fill="#38BDF8"/>
  <rect x="114" y="38" width="6" height="14" rx="2" fill="#38BDF8"/>
  <!-- Chip pins bottom -->
  <rect x="72" y="140" width="6" height="14" rx="2" fill="#38BDF8"/>
  <rect x="86" y="140" width="6" height="14" rx="2" fill="#38BDF8"/>
  <rect x="100" y="140" width="6" height="14" rx="2" fill="#38BDF8"/>
  <rect x="114" y="140" width="6" height="14" rx="2" fill="#38BDF8"/>
  <!-- Inner core -->
  <rect x="72" y="72" width="48" height="48" rx="6" fill="#38BDF8" opacity="0.15"/>
  <rect x="80" y="80" width="32" height="32" rx="4" fill="#38BDF8" opacity="0.3"/>
  <!-- Forge flame mark -->
  <path d="M96 86 L104 100 L96 96 L88 100 Z" fill="#38BDF8"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
